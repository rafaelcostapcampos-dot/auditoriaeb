let af='todos';
function brl(v){return v==null?null:v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function nr(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,' ');}
function setF(f,btn){af=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('active'));btn.classList.add('active');doSearch();}
function doSearch(){
  const q=document.getElementById('si').value.trim();
  const gr=document.getElementById('gs').value;
  const ws=nr(q).split(/\s+/).filter(Boolean);
  let res=D.filter(p=>{
    const h=nr(p.codigo+' '+p.nome+' '+p.grupo);
    if(ws.length&&!ws.every(w=>h.includes(w)))return false;
    if(gr&&p.grupo!==gr)return false;
    if(af==='amb')return p.amb!=null;
    if(af==='hosp')return p.hosp!=null;
    if(af==='dut')return p.temDUT;
    return true;
  });
  render(res,q,gr);
}
function render(res,q,gr){
  const w=document.getElementById('rw');
  if(!q&&!gr&&af==='todos'){w.innerHTML='<div class="initial"><div class="ii">📋</div><h3>Consulta de Procedimentos – FUSEx / PMGuBH</h3><p>Digite um código ou nome para pesquisar na tabela.</p></div>';return;}
  if(!res.length){w.innerHTML='<div class="empty"><div class="ei">🔍</div><h3>Nenhum resultado encontrado</h3><p>Tente outro código ou nome de procedimento</p></div>';return;}
  let h=`<div class="rc">Mostrando <b>${res.length}</b> resultado${res.length!==1?'s':''}</div>`;
  res.forEach((p,i)=>{
    const as=brl(p.amb),a7=brl(p.amb70),hs=brl(p.hosp),h7=brl(p.hosp70);
    const tags=[];
    if(as)tags.push(`<span class="tag ta">🏥 Amb: ${as}</span>`);
    if(a7)tags.push(`<span class="tag ta7">Amb 70%: ${a7}</span>`);
    if(hs)tags.push(`<span class="tag th">🏨 Hosp: ${hs}</span>`);
    if(h7)tags.push(`<span class="tag th7">Hosp 70%: ${h7}</span>`);
    if(p.temDUT)tags.push(`<span class="tag td" id="dtg${i}" onclick="tg(${i},event)">📋 Ver DUT ▼</span>`);
    const db=p.temDUT?`<div class="cd" id="dut${i}"><div class="cdt">📋 Diretriz de Utilização (DUT) – ANS</div><div class="cdc">${p.dut}</div></div>`:'';
    h+=`<div class="card"><div class="ch"><div class="cb">${p.codigo}</div><div><div class="ct">${p.nome}</div><div class="cst">${p.grupo}</div></div></div><div class="cv">${tags.join('')}</div>${db}</div>`;
  });
  w.innerHTML=h;
}
function tg(i,e){
  e.stopPropagation();
  const el=document.getElementById('dut'+i);
  const tg=document.getElementById('dtg'+i);
  if(el.classList.contains('open')){el.classList.remove('open');tg.textContent='📋 Ver DUT ▼';}
  else{el.classList.add('open');tg.textContent='📋 Fechar DUT ▲';}
}
document.getElementById('si').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
document.getElementById('si').addEventListener('input',()=>doSearch());
document.getElementById('tp').textContent=D.length;
document.getElementById('td').textContent=D.filter(d=>d.temDUT).length;
const gs=[...new Set(D.map(d=>d.grupo))];
document.getElementById('tg').textContent=gs.length;
</script>
